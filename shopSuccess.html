<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | F7 Coaching</title>
  <link rel="stylesheet" href="Styles/indexStyles.css">
  <style>
    body {
      background: #f5f5f5;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      color: #222;
    }
    .success-container {
      max-width: 420px;
      margin: 48px auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px #00b05033;
      border: 2px solid #00b050;
      padding: 36px 28px 28px 28px;
      text-align: center;
    }
    .success-container h2 {
      color: #00b050;
      font-size: 2rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .order-details {
      margin: 28px 0 0 0;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 18px 12px;
      box-shadow: 0 1px 4px #eee;
      font-size: 1.08rem;
      color: #222;
      text-align: left;
    }
    .order-details strong {
      color: #00b050;
    }
    .order-details table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .order-details th, .order-details td {
      padding: 8px;
      text-align: left;
      font-size: 1rem;
    }
    .order-details th {
      background: #eafbe7;
      color: #00b050;
      font-weight: 600;
    }
    .order-details td {
      border-bottom: 1px solid #eee;
    }
    .order-summary {
      margin-top: 18px;
      font-size: 1rem;
    }
    .order-summary td {
      padding: 8px;
    }
    .collection-msg {
      margin-top: 18px;
      color: #00b050;
      font-size: 1.08rem;
      font-weight: 500;
      text-align: center;
    }
    .return-btn {
      display: inline-block;
      margin-top: 28px;
      color: #00b050;
      text-decoration: underline;
      font-size: 1.08rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .return-btn:hover {
      color: #007a3d;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <h2>✅ Order Confirmed!</h2>
    <p>Thank you for your purchase. We'll send tracking info when your order ships.</p>
    <div class="order-details" id="orderDetails">
      <!-- Order details will be injected here -->
    </div>
    <div class="collection-msg">Orders are to be collected at your next session when available.</div>
    <a href="/index.html" class="return-btn">Return to Homepage</a>
  </div>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Scripts/EmailJS.js"></script>
<script type="module" src="./Scripts/shopSuccess.js"></script>
</body>
</html>
