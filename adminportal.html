<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal - F7 Coaching</title>
  <link rel="stylesheet" href="Styles/adminStyles.css">
  <link rel="icon" href="Images/faviconV2.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #fff; }
    .panel { display: none; }
    .visible { display: block; }
    input, button { margin: 10px 0; padding: 10px; font-size: 1rem; width: 100%; max-width: 400px; }
    button { background: limegreen; border: none; color: black; cursor: pointer; }
    h2 { color: limegreen; }
  </style>
</head>
<body>

  <!-- Login Panel -->
  <div id="loginPanel" class="panel visible">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="panel">
    <h2>Welcome, Admin</h2>
    <p>You are now logged in. More admin tools will go here.</p>

    <h3>Edit Schedule</h3>
    <div id="scheduleEditor"></div>
<!-- Seed Schedule Button -->
<button id="seedBtn">Seed Schedule</button>
<button class="delete" onclick="deleteSchedule('${key}')">🗑️ Delete</button>


<!-- Add New Group Form -->

<h3>Add New Group</h3>
<form id="addGroupForm">
  <input type="text" id="newGroupName" placeholder="Group Name" required />
  <div id="newGroupTimesContainer">
    <input type="text" class="newGroupTime" placeholder="Time" required />
  </div>
  <button type="button" id="addTimeFieldBtn" style="background:#222;color:#0f0;margin-bottom:10px;">+ Add Another Time</button>
  <input type="text" id="newGroupLocation" placeholder="eg. Fairlop waters, Ilford IG6 3HX (Tuesday)" required />
  <button type="submit">Add Group</button>
</form>


    <button id="logoutBtn">Logout</button>
  </div>

  <!-- Import auth.js and run logic -->
  <script type="module">
  import { getDatabase, ref, onValue, update, set, push, remove, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
    import { loginUser, logoutUser, onUserChange } from './Scripts/auth.js';
  
    const db = getDatabase();
    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
  
    const seedData = {
      tues_fairlop: {
        groupName: "Elite Sessions",
        times: ["4–5 PM Elite Session", "5–6 PM Elite Session", "6–7 PM Elite Session"],
        location: "Fairlop Waters, Ilford IG6 3HX (Tuesday)"
      },
      wed_fairlop: {
        groupName: "Elite Sessions",
        times: ["4:30–5:30 PM Elite Session", "5:30–6:30 PM Elite Session", "6:30–7:30 PM Elite Session", "7:30–8:30 PM Elite Session"],
        location: "Fairlop Waters, Ilford IG6 3HX (Wednesday)"
      },
      thurs_shooters: {
        groupName: "Elite Sessions",
        times: ["4:00–5:00 PM Elite Session", "5:00–6:00 PM Elite Session", "6:00–7:00 PM Elite Session"],
        location: "Shooters North Weald, CM16 6AR (Thursday)"
      },
      fri_fairlop: {
        groupName: "Elite Sessions",
        times: ["4:30–5:30 PM Elite Session", "5:30–6:30 PM Elite Session", "6:30–7:30 PM Elite Session", "7:30–8:30 PM Elite Session"],
        location: "Fairlop Waters, Ilford IG6 3HX (Friday)"
      },
      sat_wadham: {
        groupName: "Elite Sessions",
        times: ["9–10 AM Elite Session", "12–1 PM Elite Session"],
        location: "Wadham Lodge, Walthamstow E17 4LL (Saturday)"
      }
    };
  
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;
        try {
            await loginUser(email, pass);
            alert("✅ Logged in!");
        } catch (err) {
            alert("❌ Login failed: " + err.message);
        }
        });


    // Handle login/logout state
    onUserChange((user) => {
      if (user) {
        console.log("✅ Logged in as:", user.uid);
        loginPanel.classList.remove("visible");
        adminPanel.classList.add("visible");
        loadScheduleEditor();
      } else {
        console.warn("❌ No user logged in");
        adminPanel.classList.remove("visible");
        loginPanel.classList.add("visible");
      }
    });
  
    // Load all existing groups
    function loadScheduleEditor() {
      const container = document.getElementById("scheduleEditor");
      const scheduleRef = ref(db, "schedule");
      get(scheduleRef).then((snapshot) => {
        const data = snapshot.val();
        container.innerHTML = ""; // Clear editor

        if (!data) {
          container.innerHTML = "<p>No groups found. Use the 'Seed Schedule' button to begin.</p>";
          return;
        }

        // Assign unique order values if missing or duplicated
        let entries = Object.entries(data);
        let needsOrderFix = false;
        let usedOrders = new Set();
        entries.forEach(([key, item], idx) => {
          if (typeof item.order !== 'number' || usedOrders.has(item.order)) {
            needsOrderFix = true;
          } else {
            usedOrders.add(item.order);
          }
        });
        if (needsOrderFix) {
          // Assign unique order values and update in DB
          const updates = {};
          entries.forEach(([key, item], idx) => {
            item.order = idx;
            updates[key + '/order'] = idx;
          });
          update(scheduleRef, updates);
        }
        // Now sort and render
        entries.forEach(([key, item], idx) => {
          if (typeof item.order !== 'number') item.order = idx;
        });
        entries.sort(([, a], [, b]) => a.order - b.order);

        entries.forEach(([key, item], idx) => {
          const div = document.createElement("div");
          div.style.marginBottom = "20px";

          // Render each time as a separate input if times is an array
          let timesInputs = "";
          if (Array.isArray(item.times)) {
            item.times.forEach((t, tIdx) => {
              timesInputs += `<input type=\"text\" id=\"${key}-time-${tIdx}\" value=\"${t}\" style=\"margin-bottom:4px;\" /><br>`;
            });
          } else {
            timesInputs = `<input type=\"text\" id=\"${key}-time-0\" value=\"${item.time || ''}\" /><br>`;
          }

          // Move Up/Down buttons
          let moveBtns = '';
          moveBtns += `<button type=\"button\" onclick=\"moveSchedule('${key}','up')\" ${idx===0?'disabled':''} style=\"width:48%;display:inline-block;margin-right:2%\">⬆️ Move Up</button>`;
          moveBtns += `<button type=\"button\" onclick=\"moveSchedule('${key}','down')\" ${idx===entries.length-1?'disabled':''} style=\"width:48%;display:inline-block;\">⬇️ Move Down</button>`;

          div.innerHTML = `
                <h4>${item.groupName}</h4>
                <label>Times:</label><br>
                ${timesInputs}
                <label>Location:</label><br>
                <input type=\"text\" id=\"${key}-location\" value=\"${item.location}\" /><br>
                ${moveBtns}
                <button onclick=\"saveSchedule('${key}')\">💾 Save</button>
                <button onclick=\"deleteSchedule('${key}')\" style=\"background: crimson; color: white;\">🗑️ Delete</button>
                <hr />
              `;
          container.appendChild(div);
        });
      });
// Move schedule item up or down
window.moveSchedule = function(key, direction) {
  const scheduleRef = ref(db, "schedule");
  console.log('moveSchedule called', key, direction);
  get(scheduleRef).then((snapshot) => {
    const data = snapshot.val();
    if (!data) {
      alert('No schedule data found.');
      console.error('No schedule data found.');
      return;
    }
    let entries = Object.entries(data).map(([k, item]) => {
      if (typeof item.order !== 'number') item.order = 0;
      return [k, item];
    });
    // Sort by order
    entries.sort(([, a], [, b]) => a.order - b.order);
    const idx = entries.findIndex(([k]) => k === key);
    if (idx === -1) {
      alert('Could not find item to move.');
      console.error('Could not find item to move:', key);
      return;
    }
    let swapIdx = direction === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= entries.length) {
      alert('Cannot move further in this direction.');
      console.warn('Cannot move further in this direction:', direction);
      return;
    }
    // Swap order values
    const temp = entries[idx][1].order;
    entries[idx][1].order = entries[swapIdx][1].order;
    entries[swapIdx][1].order = temp;
    // Write both updated items
    const updates = {};
    updates[entries[idx][0] + "/order"] = entries[idx][1].order;
    updates[entries[swapIdx][0] + "/order"] = entries[swapIdx][1].order;
    update(scheduleRef, updates).then(() => {
      console.log('Order updated:', updates);
      loadScheduleEditor();
    }).catch(err => {
      alert('Failed to update order: ' + err.message);
      console.error('Failed to update order:', err);
    });
  }).catch(err => {
    alert('Failed to fetch schedule: ' + err.message);
    console.error('Failed to fetch schedule:', err);
  });
}
    }
  
    // Save changes to an existing group
    window.saveSchedule = function (key) {
      // Collect all time inputs for this group
      const times = [];
      let idx = 0;
      while (true) {
        const input = document.getElementById(`${key}-time-${idx}`);
        if (!input) break;
        if (input.value.trim() !== "") times.push(input.value.trim());
        idx++;
      }
      const location = document.getElementById(`${key}-location`).value;
  
      update(ref(db, `schedule/${key}`), {
        times: times,
        location: location
      })
      .then(() => alert(`✅ ${key} updated!`))
      .catch((err) => alert("❌ Error: " + err.message));
    };

    window.deleteSchedule = function (key) {
  if (confirm(`Are you sure you want to delete "${key}"? This cannot be undone.`)) {
    remove(ref(db, `schedule/${key}`))
      .then(() => alert(`🗑️ ${key} deleted.`))
      .catch((err) => alert("❌ Error deleting group: " + err.message));
  }
};
  
    // Seed button logic
  document.getElementById("seedBtn").addEventListener("click", async () => {
      // Copy the current admin portal schedule to the live schedule node in Firebase, preserving order
      const scheduleRef = ref(db, 'schedule');
      const liveScheduleRef = ref(db, 'live_schedule');
      const { push, set } = await import('https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js');
      get(scheduleRef).then((snapshot) => {
        const data = snapshot.val();
        if (!data) {
          alert('No schedule data to publish.');
          return;
        }
        // Sort entries by order property
        let entries = Object.entries(data);
        entries.forEach(([key, item], idx) => {
          if (typeof item.order !== 'number') item.order = idx;
        });
        entries.sort(([, a], [, b]) => a.order - b.order);
        // Remove all existing live_schedule first
        set(liveScheduleRef, null).then(() => {
          // Add each group in order
          const addNext = (i) => {
            if (i >= entries.length) {
              alert('✅ Schedule published to website!');
              return;
            }
            const group = entries[i][1];
            const newRef = push(liveScheduleRef);
            set(newRef, group).then(() => addNext(i + 1)).catch(err => {
              alert('❌ Error publishing group: ' + err.message);
            });
          };
          addNext(0);
        });
      }).catch(err => {
        alert('❌ Error reading schedule: ' + err.message);
      });
    });
  

    // Add multiple time fields for new group
    document.getElementById("addTimeFieldBtn").addEventListener("click", () => {
      const container = document.getElementById("newGroupTimesContainer");
      const input = document.createElement("input");
      input.type = "text";
      input.className = "newGroupTime";
      input.placeholder = "Time";
      input.required = true;
      container.appendChild(input);
    });

    // Add new group
    document.getElementById("addGroupForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("newGroupName").value;
      const location = document.getElementById("newGroupLocation").value;
      const timeInputs = document.querySelectorAll(".newGroupTime");
      const times = Array.from(timeInputs).map(input => input.value.trim()).filter(Boolean);
      if (times.length === 0) {
        alert("Please enter at least one Day & Time.");
        return;
      }
      const scheduleRef = ref(db, "schedule");
      get(scheduleRef).then((snapshot) => {
        const data = snapshot.val() || {};
        let maxOrder = -1;
        Object.values(data).forEach(item => {
          if (typeof item.order === 'number' && item.order > maxOrder) maxOrder = item.order;
        });
        const newGroupRef = push(scheduleRef);
        set(newGroupRef, {
          groupName: name,
          times: times,
          location: location,
          order: maxOrder + 1
        })
        .then(() => {
          alert("✅ New group added!");
          document.getElementById("addGroupForm").reset();
          // Remove extra time fields except the first
          const container = document.getElementById("newGroupTimesContainer");
          while (container.children.length > 1) container.removeChild(container.lastChild);
        })
        .catch(err => alert("❌ Failed to add group: " + err.message));
      });
    });
  
    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await logoutUser();
        window.location.href = "index.html";
      } catch (err) {
        alert("Error logging out: " + err.message);
      }
    });
  </script>
  

</body>
</html>
